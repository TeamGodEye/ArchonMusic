version: "3.9"

services:
  FoxyMusic:
    build: .
    container_name: FoxyMusic_bot
    restart: always
    command: python3 -m FoxyMusic
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
